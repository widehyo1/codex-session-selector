[package]
name = "codex-session-selector"
version = "0.3.0"
autobins = false
edition = "2024"
rust-version = "1.97"
description = "TUI utilities for indexing, selecting, and replaying local Codex session JSONL files."
repository = "https://github.com/widehyo1/codex-session-selector"
readme = "README.md"
license = "MIT"
keywords = ["codex", "tui", "session", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
arboard = "3.4"
crossterm = "0.29"
ratatui = "0.30"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "select-codex-session"
path = "src/main.rs"
