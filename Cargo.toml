[package]
name = "codex-session-selector"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "TUI utilities for indexing, selecting, and replaying local Codex session JSONL files."
repository = "https://github.com/widehyo1/codex-session-selector"
readme = "README.md"
license = "MIT"
keywords = ["codex", "tui", "session", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
arboard = "3.4"
crossterm = "0.29"
ratatui = "0.30"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "record-codex-session-info"
path = "src/bin/record-codex-session-info.rs"

[[bin]]
name = "select-codex-session"
path = "src/bin/select-codex-session.rs"

[[bin]]
name = "codex-replay-tui"
path = "src/bin/codex-replay-tui.rs"
